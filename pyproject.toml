[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-nevergrad"
version = "0.1.0"
description = "Nevergrad-compatible continuous optimizers with Mojo kernels"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["nevergrad>=1.0.12,<2", "numpy>=1.24"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
